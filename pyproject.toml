[project]
name = "flowchartmaker"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "PriyankaDani", email = "priyanka.dani1497@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "waitress>=3.0.2",
]

[project.scripts]
flowchartmaker = "flowchartmaker.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]
